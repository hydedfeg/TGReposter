name: CI

on:
  push:
    branches:
      - main
      - feat/multilingual-step-1-i18n-foundation
      - feat/commercial-staging-integration
      - feat/billing-financial-acceptance-tests
      - feat/live-staging-acceptance-harness
      - feat/phase12-payment-audit-acceptance
  pull_request:
    branches:
      - main
      - feat/crypto-payment-infrastructure
      - feat/commercial-staging-integration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Test and production build
        run: npm run build

  postgres-financial-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase11_local_test
          POSTGRES_DB: tgreposter_billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tgreposter_billing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_DATABASE_URL: postgresql://postgres:phase11_local_test@127.0.0.1:5432/tgreposter_billing_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove real PostgreSQL concurrency and idempotence
        run: node --import tsx --test tests/billingConcurrentPg.pg-check.ts

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Retrieve advisory metadata
        shell: bash
        run: |
          npm audit --json > audit-full.json || status=$?
          if [ "${status:-0}" -gt 1 ]; then
            echo "npm audit full-tree failed unexpectedly"
            exit 1
          fi
          npm audit --omit=dev --json > audit-production.json || status_prod=$?
          if [ "${status_prod:-0}" -gt 1 ]; then
            echo "npm audit production-tree failed unexpectedly"
            exit 1
          fi

      - name: Report direct, transitive and production vulnerability baseline
        run: node scripts/reportNpmAudit.mjs audit-full.json audit-production.json

      - name: Preserve evidence for reviewed dependency updates
        uses: actions/upload-artifact@v4
        with:
          name: phase12-dependency-audit
          path: |
            audit-full.json
            audit-production.json
          retention-days: 14
