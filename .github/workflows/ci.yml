name: CI

on:
  push:
    branches:
      - main
      - feat/multilingual-step-1-i18n-foundation
      - feat/commercial-staging-integration
      - feat/billing-financial-acceptance-tests
      - feat/live-staging-acceptance-harness
  pull_request:
    branches:
      - main
      - feat/crypto-payment-infrastructure
      - feat/commercial-staging-integration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Test and production build
        run: npm run build

  postgres-financial-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase11_local_test
          POSTGRES_DB: tgreposter_billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tgreposter_billing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_DATABASE_URL: postgresql://postgres:phase11_local_test@127.0.0.1:5432/tgreposter_billing_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove real PostgreSQL concurrency and idempotence
        run: node --import tsx --test tests/billingConcurrentPg.pg-check.ts
