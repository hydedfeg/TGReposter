name: CI

on:
  push:
    branches:
      - main
      - feat/multilingual-step-1-i18n-foundation
      - feat/commercial-staging-integration
      - feat/customer-usdt-checkout
  pull_request:
    branches:
      - main
      - feat/crypto-payment-infrastructure
      - feat/commercial-staging-integration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Test and production build
        run: npm run build
