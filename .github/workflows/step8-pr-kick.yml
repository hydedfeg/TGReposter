name: Kick Step 8 patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  kick:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot-step-8-publishing-tests
          fetch-depth: 0

      - name: Enable patch workflow for bot push
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/step8-tests-patch.yml')
          text = path.read_text()
          text = text.replace("    if: github.actor != 'github-actions[bot]'", "    if: true", 1)
          text = text.replace(
            '          rm .github/workflows/step8-tests-patch.yml',
            '          rm .github/workflows/step8-tests-patch.yml .github/workflows/step8-pr-kick.yml',
            1
          )
          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/step8-tests-patch.yml
          git commit -m "chore: trigger Step 8 test patch"
          git push origin HEAD:bot-step-8-publishing-tests
