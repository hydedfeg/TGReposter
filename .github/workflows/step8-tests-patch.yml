          publisher = r'''import fs from "fs";
import mediaService from "./mediaService";

export interface TelegramPublishTarget {
  id: string;
  channelId: string;
  name: string;
  enabled: boolean;
}

export interface TelegramPublishPost {
  text: string;
  url: string;
  photoUrl?: string;
  videoUrl?: string;
}

export interface TelegramTargetResult {
  targetId: string;
  name: string;
  success: boolean;
  error?: string;
  warning?: string;
}

export interface TargetSelectionResult {
  ok: boolean;
  targets: TelegramPublishTarget[];
  error?: string;
  invalidTargetIds?: string[];
  disabledTargetIds?: string[];
}

export interface TelegramDeliveryResult {
  success: boolean;
  outcome: "success" | "partial" | "failure";
  summary: { total: number; succeeded: number; failed: number; warnings: number };
  results: TelegramTargetResult[];
}

type DownloadedImage = Awaited<ReturnType<typeof mediaService.downloadImageWithMetadata>>;
type DownloadedVideo = Awaited<ReturnType<typeof mediaService.downloadVideoWithMetadata>>;
type MediaServiceLike = {
  downloadImageWithMetadata(url: string): Promise<DownloadedImage>;
  downloadVideoWithMetadata(url: string): Promise<DownloadedVideo>;
  deleteTemp(filepath?: string | null): void;
};

export interface TelegramPublisherDependencies {
  fetchFn?: typeof fetch;
  media?: MediaServiceLike;
  readFileSync?: typeof fs.readFileSync;
  textTimeoutMs?: number;
  mediaTimeoutMs?: number;
}

export function splitTelegramText(text: string, maxLength = 4000): string[] {
  const characters = Array.from(text);
  const chunks: string[] = [];
  let start = 0;
  while (start < characters.length) {
    const remainingLength = characters.length - start;
    if (remainingLength <= maxLength) {
      const finalChunk = characters.slice(start).join("");
      if (finalChunk.trim()) chunks.push(finalChunk);
      break;
    }
    const window = characters.slice(start, start + maxLength);
    const minimumNaturalBreak = Math.floor(maxLength * 0.6);
    let splitAt = -1;
    for (let i = window.length - 1; i >= minimumNaturalBreak; i--) {
      if (window[i] === "\n") { splitAt = i + 1; break; }
    }
    if (splitAt === -1) {
      for (let i = window.length - 1; i >= minimumNaturalBreak; i--) {
        if (/\s/.test(window[i])) { splitAt = i + 1; break; }
      }
    }
    const take = splitAt > 0 ? splitAt : maxLength;
    const chunk = characters.slice(start, start + take).join("");
    if (chunk.trim()) chunks.push(chunk);
    start += take;
  }
  return chunks;
}

export function resolveTelegramTargets(configuredTargets: TelegramPublishTarget[], legacyChannelId: unknown, targetIds: unknown): TargetSelectionResult {
  const targets = Array.isArray(configuredTargets) ? configuredTargets : [];
  if (targetIds !== undefined) {
    if (!Array.isArray(targetIds)) return { ok: false, targets: [], error: "targetIds must be an array when provided." };
    const malformed = targetIds.some(targetId => typeof targetId !== "string" || targetId.trim().length === 0);
    if (malformed) return { ok: false, targets: [], error: "Every selected target ID must be a non-empty string." };
    const requested = Array.from(new Set(targetIds.map(targetId => targetId.trim())));
    if (requested.length === 0) return { ok: false, targets: [], error: "No Telegram targets were selected." };
    const byId = new Map(targets.map(target => [target.id, target]));
    const unknownTargetIds = requested.filter(targetId => !byId.has(targetId));
    if (unknownTargetIds.length) return { ok: false, targets: [], error: `Unknown Telegram target ID${unknownTargetIds.length === 1 ? "" : "s"}: ${unknownTargetIds.join(", ")}.`, invalidTargetIds: unknownTargetIds };
    const disabledTargetIds = requested.filter(targetId => byId.get(targetId)?.enabled !== true);
    if (disabledTargetIds.length) return { ok: false, targets: [], error: `Disabled Telegram target${disabledTargetIds.length === 1 ? "" : "s"} cannot be selected for publishing: ${disabledTargetIds.join(", ")}.`, disabledTargetIds };
    const requestedSet = new Set(requested);
    const seen = new Set<string>();
    const active = targets.filter(target => {
      if (!target.enabled || !requestedSet.has(target.id) || seen.has(target.id)) return false;
      seen.add(target.id);
      return true;
    });
    return active.length ? { ok: true, targets: active } : { ok: false, targets: [], error: "No enabled Telegram targets found to publish to." };
  }
  const seen = new Set<string>();
  const active = targets.filter(target => {
    if (!target.enabled || seen.has(target.id)) return false;
    seen.add(target.id);
    return true;
  });
  const legacy = typeof legacyChannelId === "string" ? legacyChannelId.trim() : "";
  if (!active.length && targets.length === 0 && legacy) return { ok: true, targets: [{ id: "legacy", channelId: legacy, name: "Default Target", enabled: true }] };
  return active.length ? { ok: true, targets: active } : { ok: false, targets: [], error: "No enabled Telegram targets found to publish to." };
}

async function fetchWithTimeout(url: string, init: RequestInit, fetchFn: typeof fetch, timeoutMs: number): Promise<Response> {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetchFn(url, { ...init, signal: controller.signal });
  } catch (err: any) {
    if (err?.name === "AbortError") throw new Error(`Telegram request timed out after ${Math.round(timeoutMs / 1000)} seconds.`);
    throw err;
  } finally {
    clearTimeout(timeout);
  }
}

async function parseTelegramResponse(response: Response, context: string) {
  const raw = await response.text();
  try { return raw ? JSON.parse(raw) : {}; }
  catch { return { ok: false, description: `Telegram returned an invalid response while ${context} (HTTP ${response.status}).` }; }
}

export async function publishToTelegramTargets(botToken: string, post: TelegramPublishPost, formattedText: string, activeTargets: TelegramPublishTarget[], dependencies: TelegramPublisherDependencies = {}): Promise<TelegramDeliveryResult> {
  const fetchFn = dependencies.fetchFn ?? fetch;
  const media = dependencies.media ?? mediaService;
  const readFileSync = dependencies.readFileSync ?? fs.readFileSync;
  const textTimeoutMs = dependencies.textTimeoutMs ?? 30_000;
  const mediaTimeoutMs = dependencies.mediaTimeoutMs ?? 90_000;
  const results: TelegramTargetResult[] = [];

  await Promise.all(activeTargets.map(async target => {
    const rawChannelId = typeof target.channelId === "string" ? target.channelId.trim() : "";
    if (!rawChannelId) {
      results.push({ targetId: target.id, name: target.name, success: false, error: "Target channel/group ID is empty." });
      return;
    }
    let formattedChannelId = rawChannelId;
    if (!formattedChannelId.startsWith("@") && !formattedChannelId.startsWith("-") && isNaN(Number(formattedChannelId))) formattedChannelId = `@${formattedChannelId}`;

    try {
      let success = false;
      let responseData: any = null;
      let warning: string | undefined;

      if (post.videoUrl) {
        const captionParts = splitTelegramText(formattedText, 1000);
        const caption = captionParts.shift() || "";
        let downloaded: DownloadedVideo = null;
        let mediaPublished = false;
        let mediaFailure = "";
        try {
          downloaded = await media.downloadVideoWithMetadata(post.videoUrl);
          if (!downloaded) throw new Error("Video download failed.");
          const form = new FormData();
          form.append("chat_id", formattedChannelId);
          form.append("supports_streaming", "true");
          if (caption) form.append("caption", caption);
          form.append("video", new Blob([readFileSync(downloaded.filepath)], { type: downloaded.contentType }), downloaded.filename);
          const response = await fetchWithTimeout(`https://api.telegram.org/bot${botToken}/sendVideo`, { method: "POST", body: form }, fetchFn, mediaTimeoutMs);
          responseData = await parseTelegramResponse(response, "sending the video");
          if (response.ok && responseData.ok) {
            mediaPublished = true;
            success = true;
            for (let index = 0; index < captionParts.length; index++) {
              const continuation = await fetchWithTimeout(`https://api.telegram.org/bot${botToken}/sendMessage`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: formattedChannelId, text: captionParts[index], disable_web_page_preview: false }) }, fetchFn, textTimeoutMs);
              const data = await parseTelegramResponse(continuation, "sending video continuation text");
              if (!continuation.ok || !data.ok) {
                success = false;
                responseData = { ok: false, description: `Video published, but continuation chunk ${index + 1}/${captionParts.length} failed: ${data.description || "Unknown Telegram continuation error"}` };
                break;
              }
            }
          } else mediaFailure = responseData.description || "Telegram rejected the video upload.";
        } catch (err: any) { mediaFailure = err.message || "Telegram video publishing failed."; }
        finally { media.deleteTemp(downloaded?.filepath); }
        if (!mediaPublished && !success) {
          const fallback = formattedText.trim() ? `${formattedText}\n\nVideo: ${post.url}` : `Video: ${post.url}`;
          const chunks = splitTelegramText(fallback);
          let fallbackSucceeded = chunks.length > 0;
          for (let index = 0; index < chunks.length; index++) {
            const response = await fetchWithTimeout(`https://api.telegram.org/bot${botToken}/sendMessage`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: formattedChannelId, text: chunks[index], disable_web_page_preview: false }) }, fetchFn, textTimeoutMs);
            const data = await parseTelegramResponse(response, "sending the video text fallback");
            if (!response.ok || !data.ok) {
              fallbackSucceeded = false;
              responseData = { ok: false, description: `Video publish failed: ${mediaFailure || "unknown media error"}. Text fallback chunk ${index + 1}/${chunks.length} also failed: ${data.description || "Unknown Telegram fallback error"}` };
              break;
            }
          }
          if (fallbackSucceeded) {
            success = true;
            warning = `Video was not attached; text fallback was published instead: ${mediaFailure || "Telegram video upload failed."}`;
            responseData = { ok: true };
          }
        }
      } else if (post.photoUrl) {
        const captionParts = splitTelegramText(formattedText, 1000);
        const caption = captionParts.shift() || "";
        let downloaded: DownloadedImage = null;
        let mediaPublished = false;
        let mediaFailure = "";
        try {
          downloaded = await media.downloadImageWithMetadata(post.photoUrl);
          if (!downloaded) throw new Error("Image download failed.");
          const form = new FormData();
          form.append("chat_id", formattedChannelId);
          if (caption) form.append("caption", caption);
          form.append("photo", new Blob([readFileSync(downloaded.filepath)], { type: downloaded.contentType }), downloaded.filename);
          const response = await fetchWithTimeout(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: "POST", body: form }, fetchFn, mediaTimeoutMs);
          responseData = await parseTelegramResponse(response, "sending the photo");
          if (response.ok && responseData.ok) {
            mediaPublished = true;
            success = true;
            for (let index = 0; index < captionParts.length; index++) {
              const continuation = await fetchWithTimeout(`https://api.telegram.org/bot${botToken}/sendMessage`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: formattedChannelId, text: captionParts[index], disable_web_page_preview: false }) }, fetchFn, textTimeoutMs);
              const data = await parseTelegramResponse(continuation, "sending photo continuation text");
              if (!continuation.ok || !data.ok) {
                success = false;
                responseData = { ok: false, description: `Photo published, but continuation chunk ${index + 1}/${captionParts.length} failed: ${data.description || "Unknown Telegram continuation error"}` };
                break;
              }
            }
          } else mediaFailure = responseData.description || "Telegram rejected the photo upload.";
        } catch (err: any) { mediaFailure = err.message || "Telegram photo publishing failed."; }
        finally { media.deleteTemp(downloaded?.filepath); }
        if (!mediaPublished && !success) {
          const fallback = formattedText.trim() ? `${formattedText}\n\nPhoto: ${post.photoUrl}` : `Photo: ${post.photoUrl}`;
          const chunks = splitTelegramText(fallback);
          let fallbackSucceeded = chunks.length > 0;
          for (let index = 0; index < chunks.length; index++) {
            const response = await fetchWithTimeout(`https://api.telegram.org/bot${botToken}/sendMessage`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: formattedChannelId, text: chunks[index], disable_web_page_preview: false }) }, fetchFn, textTimeoutMs);
            const data = await parseTelegramResponse(response, "sending the photo text fallback");
            if (!response.ok || !data.ok) {
              fallbackSucceeded = false;
              responseData = { ok: false, description: `Photo publish failed: ${mediaFailure || "unknown media error"}. Text fallback chunk ${index + 1}/${chunks.length} also failed: ${data.description || "Unknown Telegram fallback error"}` };
              break;
            }
          }
          if (fallbackSucceeded) {
            success = true;
            warning = `Photo was not attached; text fallback was published instead: ${mediaFailure || "Telegram photo upload failed."}`;
            responseData = { ok: true };
          }
        }
      } else {
        const chunks = splitTelegramText(formattedText);
        if (!chunks.length) throw new Error("Cannot publish an empty text post.");
        for (let index = 0; index < chunks.length; index++) {
          const response = await fetchWithTimeout(`https://api.telegram.org/bot${botToken}/sendMessage`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: formattedChannelId, text: chunks[index], disable_web_page_preview: false }) }, fetchFn, textTimeoutMs);
          const data = await parseTelegramResponse(response, `sending text chunk ${index + 1}/${chunks.length}`);
          responseData = data;
          if (!response.ok || !data.ok) {
            responseData = { ...data, description: `Text chunk ${index + 1}/${chunks.length} failed: ${data.description || "Unknown Telegram text publishing error"}` };
            break;
          }
          if (index === chunks.length - 1) success = true;
        }
      }

      if (success) results.push({ targetId: target.id, name: target.name, success: true, ...(warning ? { warning } : {}) });
      else results.push({ targetId: target.id, name: target.name, success: false, error: responseData?.description || "Unknown error response from Telegram" });
    } catch (err: any) {
      results.push({ targetId: target.id, name: target.name, success: false, error: err.message || "Telegram publishing failed." });
    }
  }));

  const targetOrder = new Map(activeTargets.map((target, index) => [target.id, index]));
  results.sort((a, b) => (targetOrder.get(a.targetId) ?? Number.MAX_SAFE_INTEGER) - (targetOrder.get(b.targetId) ?? Number.MAX_SAFE_INTEGER));
  const succeeded = results.filter(result => result.success).length;
  const failed = results.length - succeeded;
  const warnings = results.filter(result => !!result.warning).length;
  const outcome: TelegramDeliveryResult["outcome"] = succeeded === results.length ? "success" : succeeded > 0 ? "partial" : "failure";
  return { success: succeeded > 0, outcome, summary: { total: results.length, succeeded, failed, warnings }, results };
}
'''

          tests = r'''import test from "node:test";
import assert from "node:assert/strict";
import { publishToTelegramTargets, resolveTelegramTargets, splitTelegramText, type TelegramPublishTarget } from "../server/services/telegramPublisher";

const targets: TelegramPublishTarget[] = [
  { id: "a", channelId: "alpha", name: "Alpha", enabled: true },
  { id: "b", channelId: "@beta", name: "Beta", enabled: true },
  { id: "off", channelId: "@off", name: "Disabled", enabled: false }
];
const okResponse = () => new Response(JSON.stringify({ ok: true, result: { message_id: 1 } }), { status: 200 });
const errorResponse = (description = "Bad Request") => new Response(JSON.stringify({ ok: false, description }), { status: 400 });

test("splitTelegramText keeps chunks within the limit and preserves emoji", () => {
  const text = `${"A".repeat(3995)}🙂${"B".repeat(50)}`;
  const chunks = splitTelegramText(text);
  assert.equal(chunks.join(""), text);
  assert.ok(chunks.every(chunk => Array.from(chunk).length <= 4000));
  assert.equal(chunks.some(chunk => chunk.includes("�")), false);
});

test("target selection rejects disabled and unknown destinations", () => {
  const disabled = resolveTelegramTargets(targets, "", ["off"]);
  assert.equal(disabled.ok, false);
  assert.deepEqual(disabled.disabledTargetIds, ["off"]);
  const unknown = resolveTelegramTargets(targets, "", ["missing"]);
  assert.equal(unknown.ok, false);
  assert.deepEqual(unknown.invalidTargetIds, ["missing"]);
});

test("legacy target is used only when no configured targets exist", () => {
  const legacy = resolveTelegramTargets([], "legacy_channel", undefined);
  assert.equal(legacy.ok, true);
  assert.equal(legacy.targets[0].channelId, "legacy_channel");
  const disabledConfigured = resolveTelegramTargets([{ id: "x", channelId: "@x", name: "X", enabled: false }], "legacy_channel", undefined);
  assert.equal(disabledConfigured.ok, false);
});

test("long text publishes in multiple plain-text chunks", async () => {
  const sentBodies: any[] = [];
  const fetchFn: typeof fetch = async (_url, init) => { sentBodies.push(JSON.parse(String(init?.body))); return okResponse(); };
  const result = await publishToTelegramTargets("token", { text: "", url: "https://t.me/source/1" }, "x".repeat(5000), [targets[0]], { fetchFn });
  assert.equal(result.outcome, "success");
  assert.equal(sentBodies.length, 2);
  assert.ok(sentBodies.every(body => body.text.length <= 4000));
  assert.equal(sentBodies.some(body => "parse_mode" in body), false);
});

test("multi-target delivery reports partial success and keeps configured order", async () => {
  const fetchFn: typeof fetch = async (_url, init) => {
    const body = JSON.parse(String(init?.body));
    if (body.chat_id === "@beta") return errorResponse("chat not found");
    return new Promise(resolve => setTimeout(() => resolve(okResponse()), 15));
  };
  const result = await publishToTelegramTargets("token", { text: "hello", url: "https://t.me/source/2" }, "hello", [targets[0], targets[1]], { fetchFn });
  assert.equal(result.outcome, "partial");
  assert.deepEqual(result.summary, { total: 2, succeeded: 1, failed: 1, warnings: 0 });
  assert.deepEqual(result.results.map(item => item.targetId), ["a", "b"]);
  assert.equal(result.results[1].error?.includes("chat not found"), true);
});

test("all target failures report failure", async () => {
  const result = await publishToTelegramTargets("token", { text: "hello", url: "https://t.me/source/3" }, "hello", [targets[0], targets[1]], { fetchFn: async () => errorResponse("forbidden") });
  assert.equal(result.success, false);
  assert.equal(result.outcome, "failure");
  assert.equal(result.summary.failed, 2);
});

test("text timeout is isolated to the slow target", async () => {
  const fetchFn: typeof fetch = async (_url, init) => {
    const body = JSON.parse(String(init?.body));
    if (body.chat_id === "@beta") return okResponse();
    return await new Promise<Response>((_resolve, reject) => {
      init?.signal?.addEventListener("abort", () => { const error = new Error("aborted"); error.name = "AbortError"; reject(error); });
    });
  };
  const result = await publishToTelegramTargets("token", { text: "hello", url: "https://t.me/source/4" }, "hello", [targets[0], targets[1]], { fetchFn, textTimeoutMs: 5 });
  assert.equal(result.outcome, "partial");
  assert.equal(result.results[0].error?.includes("timed out"), true);
  assert.equal(result.results[1].success, true);
});

test("photo upload failure falls back to text and records a warning", async () => {
  let deletedPath = "";
  let calls = 0;
  const fetchFn: typeof fetch = async url => { calls++; return String(url).endsWith("/sendPhoto") ? errorResponse("photo rejected") : okResponse(); };
  const media = {
    async downloadImageWithMetadata() { return { filepath: "/tmp/photo.jpg", filename: "photo.jpg", contentType: "image/jpeg" as const, sizeBytes: 5 }; },
    async downloadVideoWithMetadata() { return null; },
    deleteTemp(filepath?: string | null) { deletedPath = filepath || ""; }
  };
  const result = await publishToTelegramTargets("token", { text: "caption", url: "https://t.me/source/5", photoUrl: "https://cdn4.telesco.pe/photo.jpg" }, "caption", [targets[0]], { fetchFn, media, readFileSync: (() => Buffer.from("photo")) as any });
  assert.equal(result.outcome, "success");
  assert.equal(result.summary.warnings, 1);
  assert.equal(result.results[0].warning?.includes("Photo was not attached"), true);
  assert.equal(deletedPath, "/tmp/photo.jpg");
  assert.equal(calls, 2);
});

test("video upload uses sendVideo, streaming, continuation text, and cleanup", async () => {
  const urls: string[] = [];
  let videoForm: FormData | undefined;
  let deletedPath = "";
  const fetchFn: typeof fetch = async (url, init) => { urls.push(String(url)); if (String(url).endsWith("/sendVideo")) videoForm = init?.body as FormData; return okResponse(); };
  const media = {
    async downloadImageWithMetadata() { return null; },
    async downloadVideoWithMetadata() { return { filepath: "/tmp/video.mp4", filename: "video.mp4", contentType: "video/mp4" as const, sizeBytes: 5 }; },
    deleteTemp(filepath?: string | null) { deletedPath = filepath || ""; }
  };
  const result = await publishToTelegramTargets("token", { text: "", url: "https://t.me/source/6", videoUrl: "https://cdn4.telesco.pe/video.mp4" }, "v".repeat(1500), [targets[0]], { fetchFn, media, readFileSync: (() => Buffer.from("video")) as any });
  assert.equal(result.outcome, "success");
  assert.equal(urls.some(url => url.endsWith("/sendVideo")), true);
  assert.equal(urls.some(url => url.endsWith("/sendMessage")), true);
  assert.equal(videoForm?.get("supports_streaming"), "true");
  assert.equal(String(videoForm?.get("caption") || "").length <= 1000, true);
  assert.equal(deletedPath, "/tmp/video.mp4");
});
'''

