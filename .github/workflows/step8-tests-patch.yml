          route = server[route_start:route_end]
          selection_start = route.index('  const configuredTargets = Array.isArray(targets) ? targets : [];')
          selection_end = route.index('  // Find post in our DB')
          route = route[:selection_start] + '''  const configuredTargets = Array.isArray(targets) ? targets : [];\n  const selection = resolveTelegramTargets(configuredTargets, channelId, targetIds);\n  if (!selection.ok) {\n    return res.status(400).json({\n      error: selection.error,\n      ...(selection.invalidTargetIds ? { invalidTargetIds: selection.invalidTargetIds } : {}),\n      ...(selection.disabledTargetIds ? { disabledTargetIds: selection.disabledTargetIds } : {})\n    });\n  }\n  const activeTargets = selection.targets;\n\n''' + route[selection_end:]
          delivery_start = route.index('  const results: { targetId: string; name: string; success: boolean; error?: string; warning?: string }[] = [];')
          delivery_end = route.index('  if (atLeastOneSuccess) {', delivery_start)
          route = route[:delivery_start] + '''  const delivery = await publishToTelegramTargets(botToken, post, formattedText, activeTargets);\n  const { results, outcome, summary } = delivery;\n  const atLeastOneSuccess = delivery.success;\n\n  for (const result of results) {\n    const dbTargetIdx = db.destination.targets?.findIndex(target => target.id === result.targetId);\n    if (dbTargetIdx !== undefined && dbTargetIdx !== -1) {\n      db.destination.targets[dbTargetIdx].status = result.success ? "success" : "error";\n      db.destination.targets[dbTargetIdx].errorMessage = result.success ? undefined : result.error;\n    }\n  }\n\n''' + route[delivery_end:]
          old_summary = '''    outcome,\n    summary: {\n      total: results.length,\n      succeeded: successCount,\n      failed: failureCount,\n      warnings: warningCount\n    },'''
          if old_summary not in route: raise SystemExit('response summary anchor missing')
          route = route.replace(old_summary, '    outcome,\n    summary,', 1)
          server = server[:route_start] + route + server[route_end:]
          server_path.write_text(server)
